version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "semiannually"
    cooldown:
      default-days: 21
    open-pull-requests-limit: 3
    groups:
      bundler:
        patterns:
          - "*"
    assignees:
      - "epistrephein"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "semiannually"
    groups:
      github-actions:
        patterns:
          - "*"
    assignees:
      - "epistrephein"

  - package-ecosystem: "cargo"
    directory: "/"
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "semiannually"
    cooldown:
      default-days: 21
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns:
          - "*"
    assignees:
      - "epistrephein"
